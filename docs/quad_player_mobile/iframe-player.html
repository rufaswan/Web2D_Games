<!DOCTYPE html>
<html xmlns='http://www.w3.org/1999/xhtml'>
<meta charset='utf-8' />
<meta name='viewport' content='width=device-width, initial-scale=1' />
<title>Quad Player Embedded</title>
<style>
body {
	font-family : sans-serif;
	margin      : 0;
	padding     : 0;
	width       : 100vw;
	height      : 100vh;
	line-height : 1.5em;
}

table {
	border-collapse : collapse;
	width           : 100%;
	height          : 100%;
	margin          : 0 auto;
	overflow        : hidden;
}

td {
	width          : 50%;
	border         : 1px solid #000000;
	vertical-align : top;
}

#quadlist,
#pnglist {
	height  : 50%;
	padding : 1em;
}

#quadplayer {
	height  : 100%;
	padding : 0;
}

#quadplayer iframe {
	width  : 100%;
	height : 100%;
}
</style>
<body>

<table>
<tr>
	<td id='quadlist'>
		<button onclick='listfile("quad");'>QUAD</button>
		<ul></ul>
	</td>
	<td id='quadplayer' rowspan='2'>
		<iframe src='player-mobile.tpl.html' sandbox='allow-scripts allow-same-origin'></iframe>
	</td>
</tr>
<tr>
	<td id='pnglist'>
		<button onclick='listfile("png");'>PNG</button>
		<ul></ul>
	</td>
</tr>
</table>

<script>
'use strict';

var APP  = {};
APP.quad = [
	'spec/sample-v0.4-keyframe-order.quad',
	'spec/sample-v0.5-keyframe-attribute.quad',
	'spec/sample-v0.5-keyframe-colorize.quad',
	'spec/sample-v0.6-animation-matrix-mix.quad',
	'spec/sample-v0.6-animation-keyframe-mix.quad',
	'spec/sample-dungeon.quad',
];
APP.png = [
	'spec/sample-v0.6-animation-keyframe-mix.0.png',
	'spec/sample-dungeon.0.png',
];
APP.qapp = 0; // ptr* iframe var APP

APP.qapp_add_queue = function( data, name ){
	APP.qapp.upload_queue.push({
		id   : 0,
		name : name,
		data : data,
	});
	APP.qapp.upload_id = 0;
	APP.qapp.process_uploads();
}
APP.getfile = function( elem ){
	var type = elem.getAttribute('data-type');
	var name = elem.innerText;

	switch ( type ){
		case 'quad':
			window.fetch(name).then(function(res){
				if ( ! res.ok )
					throw new Error(res);
				return res.text(); // promise resolves to Response object
			}).then(function(res){
				APP.qapp_add_queue(res, name);
			}).catch(function(error){
				console.error('APP.getfile()', elem, error);
			});
			return;
		case 'png':
			window.fetch(name).then(function(res){
				if ( ! res.ok )
					throw new Error(res);
				return res.blob(); // promise resolves to Response object
			}).then(function(res){
				var reader = new FileReader;
				reader.onload = function(){
					APP.qapp_add_queue(reader.result, name);
				};
				reader.readAsDataURL(res);
			}).catch(function(error){
				console.error('APP.getfile()', elem, error);
			});
			return;
	} // switch ( type )
}
//////////////////////////////
APP.olfile = function( list, type ){
	var html = '';
	list.forEach(function(v,k){
		var li = document.createElement('li');
		li.setAttribute('data-type' , type);
		li.setAttribute('onclick'   , 'APP.getfile(this);');
		li.innerHTML = v;
		html += li.outerHTML;
	});
	var ul = document.querySelector(`#${type}list ul`);
	ul.innerHTML = html;
}
APP.listfile = function( type ){
	var url = window.location.href.replace('.html','.php') + `?${type}`;
	window.fetch(url).then(function(res){
		if ( ! res.ok )
			throw new Error(res);
		return res.json(); // return promise
	}).then(function(res){
		APP[type] = res;
		APP.olfile(res, type);
	});
}

// default list
APP.olfile(APP.quad, 'quad');
APP.olfile(APP.png , 'png' );

// if localhost succeed
APP.iframe = document.querySelector('#quadplayer iframe');
APP.iframe.onload = function(){
	APP.qapp = APP.iframe.contentWindow.APP;
	APP.qapp.remove_upload();
	APP.listfile('quad');
	APP.listfile('png');
}
</script>
</body>
</html>
